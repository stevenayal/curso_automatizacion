$kind: http-request
name: POST /resources — crear
url: "{{baseUrl}}/resources"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Ejemplo",
      "description": "Recurso de ejemplo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('body has id', () => pm.expect(json).to.have.property('id'));
      pm.environment.set('resourceId', json.id);
    language: text/javascript
order: 2000
