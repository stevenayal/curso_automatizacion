# V_PERFILES.properties — perfiles de carga PtU CPTJM para P_SANDBOX_API.jmx
# Powered by skill jmeter · aiquaa.com
#
# Uso: pasar UN bloque por corrida con -J, no todo el archivo junto.
# Ejemplo:
#   jmeter -n -t P_SANDBOX_API.jmx -l results/R_SANDBOX_API.jtl \
#     -JbaseUrl=aiquaa-sandbox-api.vercel.app -JapiKey=sbx_alumno01_xxx \
#     -Jperfil=carga -Jthreads=20 -Jrampup=30 -Jloops=-1 -Jduration=120
#
# Con una sola x-api-key, el rate limit del sandbox es 30 req/min — ver
# references/perfiles.md sección "rate limit" antes de subir threads.

# ── baseline — LO1, 1.1.3.5.1 — mejor tiempo posible, sin concurrencia ──
# threads=1 rampup=0 loops=10 duration=3600 (no se alcanza — gana loops)
baseline.threads=1
baseline.rampup=0
baseline.loops=10
baseline.duration=3600

# ── carga — comportamiento esperado, concurrencia realista ──
# ajustar threads a la concurrencia esperada real del sistema bajo prueba
carga.threads=10
carga.rampup=30
carga.loops=-1
carga.duration=120

# ── estres — 2-5x la carga esperada, buscar el punto de quiebre ──
estres.threads=30
estres.rampup=30
estres.loops=-1
estres.duration=180

# ── pico — ráfaga corta, evaluar recuperación post-pico ──
pico.threads=50
pico.rampup=5
pico.loops=-1
pico.duration=30

# ── resistencia — carga esperada sostenida en el tiempo, buscar fugas ──
# duration en segundos — 3600 = 1 hora. Ajustar según ventana disponible.
resistencia.threads=10
resistencia.rampup=60
resistencia.loops=-1
resistencia.duration=3600

# ── escalabilidad — correr esta tabla en pasos, uno por corrida ──
# escalón 1
escalabilidad.paso1.threads=5
escalabilidad.paso1.duration=60
# escalón 2
escalabilidad.paso2.threads=10
escalabilidad.paso2.duration=60
# escalón 3
escalabilidad.paso3.threads=20
escalabilidad.paso3.duration=60
# escalón 4
escalabilidad.paso4.threads=40
escalabilidad.paso4.duration=60
