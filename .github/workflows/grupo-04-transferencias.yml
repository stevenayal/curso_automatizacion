name: Grupo 04 - Transferencias API

on:
  pull_request:
    paths:
      - 'grupos/grupo-04-transferencias-pagos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/grupo-04-transferencias.yml'
  push:
    branches:
      - main
    paths:
      - 'grupos/grupo-04-transferencias-pagos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/grupo-04-transferencias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman:
    name: Newman G04 transferencias
    runs-on: ubuntu-latest
    environment: api_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/postman-newman-skill/reporter/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install -r skills/postman-newman-skill/reporter/requirements.txt

      - name: Ejecutar coleccion de transferencias
        run: npm run test:api:grupo-04 -- --env-var "apiKey=${{ secrets.API_KEY }}"

      - name: Generar informe PDF
        if: always()
        run: |
          if [[ -f newman/grupo-04/newman-results.json ]]; then
            python skills/postman-newman-skill/reporter/newman_report.py \
              --results newman/grupo-04/newman-results.json \
              --output newman/grupo-04/INFORME_DE_AUT_GRUPO_04_TRANSFERENCIAS.pdf \
              --banner skills/postman-newman-skill/reporter/assets/banner_portada.png \
              --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png \
              --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png \
              --api-version "v2" \
              --repo-url "${{ github.server_url }}/${{ github.repository }}" \
              --author "Grupo 04 - Transferencias y Pagos" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No se genero el JSON de resultados de Newman."
          fi

      - name: Publicar reportes Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-04-transferencias-newman-reportes
          path: newman/grupo-04/
          if-no-files-found: warn
          retention-days: 14
