name: Grupo 03 - Prestamos JMeter, Grafana e informe PDF

# Corre el plan P_GRUPO_03_PRESTAMOS.jmx en modo headless contra la sandbox v2
# (POST /prestamos con datos del CSV -> GET /prestamos/{id} correlacionado ->
# DELETE de limpieza), captura el dashboard de Grafana como evidencia, genera el
# informe PDF con la skill de JMeter y deja el job en rojo si no se cumplen los
# umbrales o si quedaron prestamos sin limpiar.

on:
  pull_request:
    paths:
      - 'tests/performance/plans/P_GRUPO_03_PRESTAMOS.jmx'
      - 'tests/performance/plans/D_GRUPO_03_PRESTAMOS.csv'
      - 'tests/performance/properties/grupo-03.properties'
      - '.github/workflows/Y_GRUPO_03_PRESTAMOS_jmeter.yml'
  workflow_dispatch:
    inputs:
      threads:
        description: Usuarios concurrentes
        default: '1'
      loops:
        description: Iteraciones por usuario (3 solicitudes por iteracion)
        default: '4'
      throughput:
        description: Tasa total objetivo en solicitudes/minuto (rate limit de la sandbox = 30)
        default: '20'

permissions:
  contents: read

concurrency:
  group: grupo-03-prestamos-sandbox
  cancel-in-progress: false

env:
  THREADS: ${{ inputs.threads || '1' }}
  LOOPS: ${{ inputs.loops || '4' }}
  TARGET_PER_MIN: ${{ inputs.throughput || '20' }}
  SLA_ERROR_RATE: '1'
  SLA_P95_MS: '3000'
  RESULTS_DIR: test-results/performance/grupo-03
  JTL_NAME: R_GRUPO_03_PRESTAMOS.jtl
  MONITORING_DASHBOARD_URL: https://purplespinach239.grafana.net/public-dashboards/32c376cff7ef437faa3435bd863f5a79
  GRAFANA_IMAGE: test-results/performance/grupo-03/evidence/GRAFANA_GRUPO_03.png
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  performance:
    name: Prestamos - Carga, Grafana y PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los PR desde forks no reciben el secret; se omiten en vez de fallar.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: api_key
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar JMeter 5.6.3
        run: |
          curl --fail --location --silent --show-error \
            https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz \
            -o "$RUNNER_TEMP/jmeter.tgz"
          tar -xzf "$RUNNER_TEMP/jmeter.tgz" -C "$RUNNER_TEMP"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-5.6.3" >> "$GITHUB_ENV"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            skills/jmeter-skill/reporter/requirements.txt
            tests/performance/monitoring/requirements.txt

      - name: Instalar dependencias del informe y del monitoreo
        run: |
          python -m pip install -r skills/jmeter-skill/reporter/requirements.txt \
            -r tests/performance/monitoring/requirements.txt

      - name: Validar carga solicitada
        run: |
          python - <<'PY'
          import os
          threads, loops, rate = (int(os.environ[n]) for n in ('THREADS', 'LOOPS', 'TARGET_PER_MIN'))
          if not (1 <= threads <= 5 and 1 <= loops <= 10 and 1 <= rate <= 25):
              raise SystemExit('Carga fuera de los limites del ensayo (rate limit de la sandbox: 30 req/min).')
          total = threads * loops * 3 + 2
          if (threads * loops * 3) * 60 / rate + 30 > 180:
              raise SystemExit('La carga no entra en los 180 s de duracion del plan.')
          print(f'Carga: {threads} usuarios x {loops} iteraciones = {total} solicitudes (con setUp y tearDown).')
          PY

      - name: Ejecutar plan headless
        # La API key sale del secret API_KEY (environment api_key); el plan la
        # lee del entorno y nunca se escribe en el plan ni en el .properties.
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then echo "::error::Falta el secret API_KEY"; exit 1; fi
          mkdir -p "$RESULTS_DIR"
          java -Djava.awt.headless=true -Xms256m -Xmx512m \
            -jar "$JMETER_HOME/bin/ApacheJMeter.jar" \
            -n -t tests/performance/plans/P_GRUPO_03_PRESTAMOS.jmx \
            -q tests/performance/properties/grupo-03.properties \
            -Jthreads="$THREADS" -Jloops="$LOOPS" -Jthroughput="$TARGET_PER_MIN" \
            -JmaxResponseMs="$SLA_P95_MS" -Jsample_variables=caso,prestamoId \
            -l "$RESULTS_DIR/$JTL_NAME" \
            -j "$RESULTS_DIR/jmeter.log" -e -o "$RESULTS_DIR/dashboard"

      - name: Capturar Grafana
        # Una captura fallida no debe bloquear el informe.
        if: always()
        continue-on-error: true
        run: |
          python tests/performance/monitoring/capture_dashboard.py \
            --url "$MONITORING_DASHBOARD_URL" \
            --output "$GRAFANA_IMAGE" \
            --wait-seconds 8 --height 2160 --ready-timeout-seconds 180

      - name: Generar PDF con la skill JMeter
        if: always()
        run: |
          EVIDENCE_ARGS=()
          if [ -f "$GRAFANA_IMAGE" ]; then
            EVIDENCE_ARGS=(--evidence-image "$GRAFANA_IMAGE" \
              --evidence-label "Grafana al finalizar la carga" \
              --evidence-url "$MONITORING_DASHBOARD_URL")
          fi
          python skills/jmeter-skill/reporter/jmeter_report.py \
            --results "$RESULTS_DIR/$JTL_NAME" \
            --output "$RESULTS_DIR/INFORME_PERF_GRUPO_03_PRESTAMOS.pdf" \
            --api-name "Grupo 03 - Prestamos API v2 (umbrales de practica)" \
            --perfil baseline --threads "$THREADS" --loops "$LOOPS" \
            --sla-error-rate "$SLA_ERROR_RATE" --sla-p95 "$SLA_P95_MS" \
            --api-version v2 \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --author "Grupo 03 - Maria Lucia Salinas, Oscar Rodriguez y Patricia Ojeda" \
            "${EVIDENCE_ARGS[@]}"

      - name: Evaluar umbrales, flujo y limpieza
        if: always()
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python - <<'PY'
          import csv, json, os, sys, time, urllib.error, urllib.request
          from pathlib import Path

          def sql_select(sql, params, intentos=4):
              # La API key es compartida con otros workflows del repo: si la sandbox
              # responde 429 (30 req/min por key), se espera a que se libere la
              # ventana del rate limit y se reintenta en vez de fallar.
              for intento in range(1, intentos + 1):
                  req = urllib.request.Request(
                      'https://aiquaa-sandbox-api.vercel.app/api/v2/sql/select',
                      headers={'x-api-key': os.environ['API_KEY'], 'Content-Type': 'application/json'},
                      data=json.dumps({'sql': sql, 'params': params}).encode())
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return json.load(r)['data']
                  except urllib.error.HTTPError as e:
                      if e.code != 429 or intento == intentos:
                          raise
                      espera = int(e.headers.get('Retry-After') or 0) or 65
                      print(f'429 en la verificacion SQL (intento {intento}); se espera {espera} s.')
                      time.sleep(espera)

          sys.path.insert(0, 'skills/jmeter-skill/reporter')
          from jmeter_report import get_verdict, parse_jtl

          out = Path(os.environ['RESULTS_DIR'])
          jtl = out / os.environ['JTL_NAME']
          stats, _, _ = parse_jtl(str(jtl))
          verdict, level = get_verdict(stats, float(os.environ['SLA_ERROR_RATE']), float(os.environ['SLA_P95_MS']))

          # Flujo esperado por iteracion: POST 201 -> GET 200 -> DELETE 200/204.
          samples = list(csv.DictReader(jtl.open(encoding='utf-8-sig')))
          flujos = {}
          for s in samples:
              if s['label'].startswith(('POST - Solicitar', 'GET - Consultar', 'DELETE - Eliminar prestamo')):
                  flujos.setdefault((s['threadName'], s.get('prestamoId', '')), []).append(s['responseCode'])
          esperado = int(os.environ['THREADS']) * int(os.environ['LOOPS'])
          completo = len(flujos) == esperado and all(
              len(c) == 3 and c[0] == '201' and c[1] == '200' and c[2] in ('200', '204') for c in flujos.values())

          # Limpieza: los prestamos creados no deben quedar activos en la BD.
          ids = sorted({int(s['prestamoId']) for s in samples if s.get('prestamoId', '').isdigit()})
          filas = []
          if ids:
              slots = ','.join('$' + str(i + 1) for i in range(len(ids)))
              filas = sql_select(f'SELECT id, estado, activo FROM prestamos WHERE id IN ({slots})', ids)
          limpio = bool(ids) and all(f.get('activo') is False for f in filas)
          (out / 'limpieza.json').write_text(json.dumps({'ids': ids, 'filas': filas}, indent=2), encoding='utf-8')

          checks = {'umbrales': level == 'pass', 'flujo_completo': completo, 'limpieza': limpio,
                    'grafana': Path(os.environ['GRAFANA_IMAGE']).is_file()}
          resultado = {'status': 'PASS' if all(checks.values()) else 'FAIL', 'checks': checks,
                       'stats': stats, 'verdict': verdict,
                       'nota': 'Umbrales de practica; Grafana muestra metricas de una sandbox compartida.'}
          (out / 'resumen.json').write_text(json.dumps(resultado, indent=2, default=str), encoding='utf-8')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Grupo 03 - Prestamos - Rendimiento\n\n| Metrica | Valor |\n|---|---|\n')
              for nombre, valor in [('Estado', resultado['status']), ('Requests', stats['total']),
                                    ('Promedio (ms)', stats['avg']), ('P95 (ms)', stats['p95']),
                                    ('Error rate (%)', stats['error_rate']), ('Veredicto', verdict)]:
                  summary.write(f'| {nombre} | {valor} |\n')
              summary.writelines(f'| Check {k} | {"OK" if v else "FALLA"} |\n' for k, v in checks.items())

          print(json.dumps(resultado, default=str))
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Publicar informe PDF (se abre en el navegador)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/performance/grupo-03/INFORME_PERF_GRUPO_03_PRESTAMOS.pdf
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar resultados del grupo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grupo-03-prestamos-jmeter-grafana
          path: test-results/performance/grupo-03/
          if-no-files-found: warn
          retention-days: 14
