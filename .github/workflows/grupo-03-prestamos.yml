name: Grupo 03 - Prestamos API

on:
  pull_request:
    paths:
      - 'grupos/grupo-03-prestamos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/grupo-03-prestamos.yml'
      - 'cucumber.js'
      - 'tests/bdd/steps/prestamos-api.steps.ts'
      - 'tests/bdd/support/prestamos-api.hooks.ts'
      - 'tests/bdd/support/loans.hooks.ts'
  push:
    branches:
      - main
    paths:
      - 'grupos/grupo-03-prestamos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/grupo-03-prestamos.yml'
      - 'cucumber.js'
      - 'tests/bdd/steps/prestamos-api.steps.ts'
      - 'tests/bdd/support/prestamos-api.hooks.ts'
      - 'tests/bdd/support/loans.hooks.ts'
  workflow_dispatch:

permissions:
  contents: read

# La API_KEY es compartida y tiene límite de requests: una corrida nueva de la
# misma rama cancela la anterior en lugar de repartir el límite entre las dos.
concurrency:
  group: grupo-03-prestamos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    name: Newman API, BDD y reportes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: api_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/postman-newman-skill/reporter/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install -r skills/postman-newman-skill/reporter/requirements.txt

      - name: Ejecutar coleccion de prestamos
        run: npm run test:api:grupo-03 -- --env-var "api_key=${{ secrets.API_KEY }}"

      - name: Generar informe PDF
        if: always()
        run: |
          if [[ -f newman/grupo-03/newman-results.json ]]; then
            python skills/postman-newman-skill/reporter/newman_report.py \
              --results newman/grupo-03/newman-results.json \
              --output newman/grupo-03/INFORME_DE_AUT_GRUPO_03_PRESTAMOS.pdf \
              --banner skills/postman-newman-skill/reporter/assets/banner_portada.png \
              --logo-aiquaa skills/postman-newman-skill/reporter/assets/logo_aiquaa_circle.png \
              --logo-postman skills/postman-newman-skill/reporter/assets/logo_postman_clean.png \
              --api-version "v2" \
              --repo-url "${{ github.server_url }}/${{ github.repository }}" \
              --author "Grupo 03 - Prestamos" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No se genero el JSON de resultados de Newman."
          fi

      - name: Publicar reportes Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-03-prestamos-newman-reportes
          path: newman/grupo-03/
          if-no-files-found: warn
          retention-days: 14

      # Perfil de solo API: no abre navegador (ver getBrowser en loans.hooks.ts).
      - name: Ejecutar escenarios BDD API de prestamos
        if: always()
        run: |
          mkdir -p results
          npm run test:bdd:g03-api
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ vars.API_URL || 'https://aiquaa-sandbox-api.vercel.app' }}

      - name: Publicar reporte BDD API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-03-prestamos-bdd-api
          path: results/cucumber-g03-api.*
          if-no-files-found: warn
          retention-days: 14

      - name: Resumir resultados BDD API
        if: always()
        run: node scripts/check-cucumber-results.mjs results/cucumber-g03-api.json

      - name: Resumen del pipeline
        if: always()
        run: |
          echo "### Grupo 03 - Préstamos" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Newman JSON/PDF: artefacto grupo-03-prestamos-newman-reportes." >> "$GITHUB_STEP_SUMMARY"
          echo "- BDD API: artefacto grupo-03-prestamos-bdd-api." >> "$GITHUB_STEP_SUMMARY"
          echo "- Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
