$kind: http-request
description: "Generated from cURL: curl https://aiquaa-sandbox-api.vercel.app/api/v2/prestamos \\\r

  \  --header 'x-api-key: YOUR_SECRET_TOKEN'"
url: https://aiquaa-sandbox-api.vercel.app/api/v2/prestamos
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is less than 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("Response has a data array", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('data');
          pm.expect(jsonData.data).to.be.an('array');
      });

      pm.test("Loan objects have required fields", function () {
          const jsonData = pm.response.json();
          if (jsonData.data.length > 0) {
              const loan = jsonData.data[0];
              pm.expect(loan).to.have.property('id');
              pm.expect(loan).to.have.property('monto_solicitado');
              pm.expect(loan).to.have.property('estado');
          }
      });
    language: text/javascript
order: 2000
