# Ensayo de carga ligera del Grupo 03 - Prestamos sobre la sandbox v2.
# Credencial: variable de entorno API_KEY o -JapiKey=... Nunca guardar su valor aqui.
protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443
perfil=baseline
threads=1
rampup=1
loops=4
duration=180
# Rate limit de la sandbox: 30 req/min por x-api-key. Se apunta a 20/min para no medir 429.
throughput=20
connectTimeoutMs=10000
responseTimeoutMs=15000
# Umbral de respuesta de la practica; no es un SLA contractual.
maxResponseMs=3000
