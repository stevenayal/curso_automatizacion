# Carga de prueba para GET /api/perf/echo (aiquaa Sandbox API, namespace perf).
# Rate limit declarado: 3000 req/min por ruta. El flujo de prueba apunta a
# 600 req/min para medir latencia sin que el 429 contamine los resultados.
# apiKey NO va aquí: pasar -JapiKey=... (secret API_KEY en CI).
protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443
threads=5
rampUp=10
duration=120
loops=-1
targetPerMin=600
delayMs=0
bytes=0
errorRate=0
